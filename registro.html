<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahorra Energía - Registro de Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">AhorraEnergía</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="equipos.html">Equipos</a></li>
          <li class="nav-item"><a class="nav-link" href="mi-factura.html">Mi Factura</a></li>
          <li class="nav-item"><a class="nav-link" href="encuesta.html">Encuesta</a></li>
          <li class="nav-item"><a class="nav-link active" href="registro.html">Registro</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="bg-dark text-white text-center py-4 mb-4">
    <div class="container">
      <h1 class="display-5 fw-bold">Registro de Comunidad Ahorradora</h1>
      <p class="lead">Regístrate para recibir consejos semanales de eficiencia energética</p>
    </div>
  </header>

  <main class="container my-4" style="max-width: 600px;">
    <div class="card shadow">
      <div class="card-body p-4">
        <form action="registro.html" method="get">
          <div class="mb-3">
            <label for="reg_nombre" class="form-label">Nombre Completo:</label>
            <input type="text" id="reg_nombre" name="reg_nombre" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="reg_correo" class="form-label">Correo Electrónico:</label>
            <input type="email" id="reg_correo" name="reg_correo" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="reg_ciudad" class="form-label">Ciudad / Municipio:</label>
            <input type="text" id="reg_ciudad" name="reg_ciudad" class="form-control" value="Medellín" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Registrarme</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">&copy; 2026 - Ahorra Energía | Elaborado por Juan Esteban Franco Monsalve</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
