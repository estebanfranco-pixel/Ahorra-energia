<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahorra Energía - Encuesta de Hábitos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">AhorraEnergía</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="equipos.html">Equipos</a></li>
          <li class="nav-item"><a class="nav-link" href="mi-factura.html">Mi Factura</a></li>
          <li class="nav-item"><a class="nav-link active" href="encuesta.html">Encuesta</a></li>
          <li class="nav-item"><a class="nav-link" href="registro.html">Registro</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Encabezado -->
  <header class="bg-primary text-white text-center py-4 mb-4">
    <div class="container">
      <h1 class="display-5 fw-bold">Encuesta de Hábitos de Consumo</h1>
      <p class="lead">Ayúdanos a identificar hábitos de consumo en los hogares</p>
    </div>
  </header>

  <main class="container my-4">

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form action="encuesta.html" method="get">
          
          <!-- Grupo 1: Datos Personales -->
          <fieldset class="border p-3 mb-4 rounded">
            <legend class="float-none w-auto px-2 fw-bold text-primary">1. Datos Generales del Hogar</legend>
            
            <!-- Campo 1: TEXT -->
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre del Responsable del Hogar:</label>
              <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Juan Esteban Franco" required>
            </div>

            <!-- Campo 2: EMAIL -->
            <div class="mb-3">
              <label for="correo" class="form-label">Correo Electrónico de Contacto:</label>
              <input type="email" id="correo" name="correo" class="form-control" placeholder="correo@ejemplo.com" required>
            </div>

            <!-- Campo 3: NUMBER -->
            <div class="mb-3">
              <label for="personas" class="form-label">Número de personas en la vivienda (1 a 10):</label>
              <input type="number" id="personas" name="personas" class="form-control" min="1" max="10" value="3" required>
            </div>
          </fieldset>

          <!-- Grupo 2: Hábitos de Consumo -->
          <fieldset class="border p-3 mb-4 rounded">
            <legend class="float-none w-auto px-2 fw-bold text-primary">2. Hábitos Energéticos</legend>

            <!-- Campo 4: SELECT -->
            <div class="mb-3">
              <label for="estrato" class="form-label">Estrato Socioeconómico de la Vivienda:</label>
              <select id="estrato" name="estrato" class="form-select" required>
                <option value="" selected disabled>Seleccione un estrato...</option>
                <option value="1">Estrato 1</option>
                <option value="2">Estrato 2</option>
                <option value="3">Estrato 3</option>
                <option value="4">Estrato 4</option>
              </select>
            </div>

            <!-- Campo 5: RANGE -->
            <div class="mb-3">
              <label for="preocupacion" class="form-label">Nivel de preocupación por el costo de la energía (1: Poco, 10: Alto):</label>
              <input type="range" id="preocupacion" name="preocupacion" class="form-range" min="1" max="10" step="1">
            </div>

            <!-- Campo 6: RADIO -->
            <div class="mb-3">
              <label class="form-label d-block">¿Desconectan los cargadores y electrodomésticos cuando no los usan?</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="desconecta" id="desconecta_si" value="si" required>
                <label class="form-check-label" for="desconecta_si">Siempre</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="desconecta" id="desconecta_a_veces" value="a_veces">
                <label class="form-check-label" for="desconecta_a_veces">A veces</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="desconecta" id="desconecta_no" value="no">
                <label class="form-check-label" for="desconecta_no">Nunca</label>
              </div>
            </div>

            <!-- Campo 7: CHECKBOX -->
            <div class="mb-3">
              <label class="form-label d-block">¿Qué equipos de mayor consumo utilizan con mayor frecuencia?</label>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="equipos" id="eq_nevera" value="nevera" checked>
                <label class="form-check-label" for="eq_nevera">Nevera</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="equipos" id="eq_lavadora" value="lavadora">
                <label class="form-check-label" for="eq_lavadora">Lavadora</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="equipos" id="eq_tv" value="tv">
                <label class="form-check-label" for="eq_tv">Televisor</label>
              </div>
            </div>

            <!-- Campo 8: TEXTAREA -->
            <div class="mb-3">
              <label for="comentarios" class="form-label">Acciones adicionales que realiza la familia para ahorrar energía:</label>
              <textarea id="comentarios" name="comentarios" class="form-control" rows="3" placeholder="Escriba sus comentarios aquí..."></textarea>
            </div>
          </fieldset>

          <button type="submit" class="btn btn-success btn-lg w-100">Enviar Encuesta</button>
        </form>
      </div>
    </div>

  </main>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">&copy; 2026 - Ahorra Energía | Elaborado por Juan Esteban Franco Monsalve</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
